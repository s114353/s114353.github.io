<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高雄動滋動｜運動球場地圖搜尋網</title>
    <style>
        /* 全域樣式美化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "微軟正黑體", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            line-height: 1.6;
        }

        /* 頂部橫幅 */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        /* 篩選控制面板 */
        .filter-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }

        .filter-group {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        .filter-group input, .filter-group select {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        .filter-group input:focus, .filter-group select:focus {
            border-color: #2563eb;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 球場卡片網格佈局 */
        .court-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* 單個卡片樣式 */
        .court-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .court-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .court-body {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* 標籤樣式 */
        .badge-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .court-badge {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .school-badge {
            background-color: #fef3c7;
            color: #d97706;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid #fcd34d;
        }

        .court-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }

        .court-info {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.4rem;
        }

        .court-tags {
            margin-top: auto;
            padding-top: 1.25rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .tag-light { background-color: #dcfce7; color: #166534; }
        .tag-no-light { background-color: #fee2e2; color: #991b1b; }
        .tag-school { background-color: #edf2f7; color: #4a5568; }

        /* 地圖導航按鈕 */
        .map-btn {
            display: block;
            text-align: center;
            background-color: #2563eb;
            color: white;
            padding: 0.7rem;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 1.25rem;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .map-btn:hover {
            background-color: #1d4ed8;
        }

        /* 找不到結果提示 */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
            font-size: 1.2rem;
            background: white;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 5rem;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        /* 手機版 RWD 排版優化 */
        @media (max-width: 640px) {
            header h1 { font-size: 1.8rem; }
            .filter-section { padding: 1rem; gap: 1rem; }
            .filter-group { min-width: 100%; }
        }
    </style>
</head>
